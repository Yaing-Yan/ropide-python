name: Build macOS binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller rich hexdump2 pick pyperclip requests

      - name: Build main
        run: pyinstaller --noconfirm --clean --onefile --name main --add-data "gadgets:gadgets" --distpath "dist/macos-${{ matrix.arch }}" main.py

      - name: Build install_nvim_plugin
        run: pyinstaller --noconfirm --clean --onefile --name install_nvim_plugin --add-data "nvim:nvim" --distpath "dist/macos-${{ matrix.arch }}" install_nvim_plugin.py

      - name: Package zip
        run: |
          cd "dist/macos-${{ matrix.arch }}"
          zip -r ../../ropide-macos-${{ matrix.arch }}.zip main install_nvim_plugin

      - uses: actions/upload-artifact@v4
        with:
          name: ropide-macos-${{ matrix.arch }}
          path: "dist/macos-${{ matrix.arch }}/*"
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ropide-macos-${{ matrix.arch }}-zip
          path: "ropide-macos-${{ matrix.arch }}.zip"
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ropide-macos-*-zip
          path: release/
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
