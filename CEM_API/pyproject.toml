[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cem-api"
version = "1.0.0"
description = "CasioEmuMsvc Python 控制库: 启动模拟器、按键、内存读写 (基于 McpPlugin MCP 接口)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
keywords = ["casio", "emulator", "nx-u8", "cem", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[tool.setuptools]
packages = ["cem"]
